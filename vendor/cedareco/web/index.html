<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>瓶中生态</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section id="binding" class="binding card">
      <p class="eyebrow">瓶中生态 · 连接状态</p>
      <h1>正在寻找池塘</h1>
      <p class="lead">观察窗只会连接 App 里的这一座池塘。</p>
      <form id="bind-form" class="bind-form">
        <button class="primary" type="submit">重新加载</button>
      </form>
      <p id="bind-error" class="error" role="status" aria-live="polite" hidden></p>
      <p class="help">仍然没有回应时，返回游戏大厅后重新进入。</p>
    </section>

    <section id="pond-app" hidden>
      <nav class="tabs" aria-label="池塘页面" role="tablist">
        <button class="tab active" data-view="state" type="button" role="tab" aria-selected="true" aria-controls="view-state">池塘</button>
        <button class="tab" data-view="codex" type="button" role="tab" aria-selected="false" aria-controls="view-codex">图鉴</button>
        <button class="tab" data-view="annals" type="button" role="tab" aria-selected="false" aria-controls="view-annals">年鉴</button>
      </nav>
      <p id="connection" class="connection" role="status" aria-live="polite">实时同步</p>

      <section id="view-state" class="view" role="tabpanel"></section>
      <section id="view-codex" class="view" role="tabpanel" hidden></section>
      <section id="view-annals" class="view" role="tabpanel" hidden></section>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h2 id="modal-title"></h2><button id="modal-close" type="button" aria-label="关闭">×</button></header>
      <div id="modal-body" class="modal-body"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
