name: Deploy QQ connector

on:
  push:
    branches:
      - main
    paths:
      - "connectors/qq_onebot/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-qq-connector
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy exact main commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          key_path="$HOME/.ssh/du-gateway-deploy"
          known_hosts_path="$HOME/.ssh/known_hosts"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_path"
          chmod 0600 "$key_path"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_path"
          chmod 0600 "$known_hosts_path"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_path" \
            -i "$key_path" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/du-deploy-qq '$TARGET_SHA'"
